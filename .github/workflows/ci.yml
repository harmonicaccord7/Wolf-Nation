name: CI

on:
  push:
    branches: [main, 'develop/**']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      # Match @playwright/test; immutable official image includes browsers/OS dependencies.
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --user 1001 --init --shm-size=1gb
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run qa:launch
      - run: npm run qa:models
      - run: npm run qa:charts
      - run: npm run qa:btc24
      - run: npm run qa:rls
      - run: npm run qa:newsletter
      - run: npm run qa:health
      - run: npm run qa:news-accounts
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      - run: npm run qa:browser
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launch-browser-qa
          path: |
            playwright-report/
            test-results/
          retention-days: 14
